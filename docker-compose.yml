services:
  yt-dlp-webui:
    image: ${GLOBAL_PERSONAL_HUB:-}elfive/yt-dlp-web:latest
    # build:
    #   context: ./src
    container_name: yt-dlp
    restart: always
    network_mode: host
    user: 0:0 # User Id, Group Id Setting
    environment:
      - TZ=${GLOBAL_TZ:-Asia/Shanghai}
    volumes:
      # - /etc/localtime:/etc/localtime
      - /opt/data/container/yt-dlp-webui/plugins:/usr/local/bin/yt-dlp-plugins
      - /opt/data/container/yt-dlp-webui/config:/etc/yt-dlp/config:r
      - /opt/data/container/yt-dlp-webui/cache:/cache
      - /opt/download/yt-dlp:/downloads
    logging:
      options:
        max-size: 10m
