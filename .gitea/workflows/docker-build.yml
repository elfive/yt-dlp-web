name: Build and push Docker image

on:
  workflow_dispatch:
  push: &trigger
    branches:
      - main
    paths-ignore:
      - '.gitea/**'
      - '.dockerignore'
      - '.eslintrc.json'
      - '.gitignore'
      - '.prettierrc.json'
      - 'README.md'

  pull_request: *trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest

    steps:
      - id: Check Envirements Variables
        run: |
          if [ -z "${{ vars.PERSONAL_DOCKER_HUB_URL }}" ]; then
            echo "vars.PERSONAL_DOCKER_HUB_URL is not defined"
            exit 1
          fi
          if [ -z "${{ vars.PERSONAL_DOCKER_HUB_USERNAME }}" ]; then
            echo "vars.PERSONAL_DOCKER_HUB_USERNAME is not defined"
            exit 1
          fi
          if [ -z "${{ secrets.PERSONAL_DOCKER_HUB_PASSWORD }}" ]; then
            echo "secrets.PERSONAL_DOCKER_HUB_PASSWORD is not defined"
            exit 1
          fi
          
      - name: Notify before build
        if: ${{ vars.PREBUILD_WEBHOOK_URL != '' }}
        run: |
          curl -fsS -X POST "${{ vars.PREBUILD_WEBHOOK_URL }}"

      - name: Checkout code
        id: checkout
        uses: ${{ vars.GLOBAL_GITEA_URL }}/actions/checkout@v4

      - name: Login to private registry
        run: |
          echo "${{ secrets.PERSONAL_DOCKER_HUB_PASSWORD }}" | \
            docker login "${{ vars.PERSONAL_DOCKER_HUB_URL }}" \
              --username "${{ vars.PERSONAL_DOCKER_HUB_USERNAME }}" \
              --password-stdin

      - name: Build image
        env:
          HTTP_PROXY: ${{ vars.GLOBAL_HTTP_PROXY }}
          HTTPS_PROXY: ${{ vars.GLOBAL_HTTPS_PROXY }}
          NO_PROXY: ${{ vars.GLOBAL_NO_PROXY }}
        run: |
          docker build -t "${{ vars.IMAGE_TAG }}" .

      - name: Push image
        run: |
          docker push "${{ vars.IMAGE_TAG }}"

      - name: Show result
        run: |
          echo "push ${{ vars.IMAGE_TAG }} to ${{ vars.PERSONAL_DOCKER_HUB_URL }} success."
      
      - name: Notify after success
        if: ${{ vars.POSTBUILD_WEBHOOK_URL != '' }}
        run: |
          curl -fsS -X POST "${{ vars.POSTBUILD_WEBHOOK_URL }}"